{% extends "base.html" %}
{% block title %}Delete Blood Request{% endblock %}
{% block content %}
<h1 class="section-title">Delete Blood Request</h1>
<div class="card" style="max-width:480px;">
    <p>Are you sure you want to delete the request for <strong>{{ req.patient_name }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions-row">
            <button type="submit" class="btn btn-danger">Yes, delete it</button>
            <a class="btn btn-secondary" href="{% url 'request_detail' req.pk %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
